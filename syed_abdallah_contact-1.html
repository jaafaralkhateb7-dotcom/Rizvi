<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  background:linear-gradient(135deg,#0d1117 0%,#161b22 55%,#222b35 100%);
  color:#fff;
}
.card{
  width:min(430px,100%);
  padding:30px 24px 24px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 70px rgba(0,0,0,.4);
  text-align:center;
}
.profile{
  width:150px;height:150px;
  margin:0 auto 18px;
  border-radius:50%;
  object-fit:cover;
  object-position:center top;
  border:4px solid rgba(255,255,255,.9);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
h1{margin:0;font-size:27px;line-height:1.2}
.title{margin:8px 0 18px;color:#cbd5e1;font-size:15px}
.location{
  margin:0 auto 22px;
  padding:11px 14px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  color:#dbe4ee;
  font-size:14px;
  line-height:1.5;
}
.links{display:grid;gap:12px}
a.button{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  padding:0 18px;
  border-radius:15px;
  color:#fff;
  text-decoration:none;
  font-size:16px;
  font-weight:700;
  transition:transform .18s ease,filter .18s ease,background .18s ease;
}
a.button:hover{transform:translateY(-2px);filter:brightness(1.08)}
.whatsapp{background:#25D366}
.call{background:#2563eb}
.email{background:#7c3aed}
.map{background:#374151}
.icon{font-size:21px;margin-right:10px}
.footer{margin-top:20px;color:#94a3b8;font-size:12px}
</style>
